services:
  user_db:
    image: postgres:15-alpine
    container_name: ms-user
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ms-user
    ports:
      - "5432:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data

  email_db:
    image: postgres:15-alpine
    container_name: ms-email
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ms-email
    ports:
      - "5433:5432"
    volumes:
      - email_db_data:/var/lib/postgresql/data

  book_db:
    image: postgres:15-alpine
    container_name: ms-book
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ms-books
    ports:
      - "5434:5432"
    volumes:
      - book_db_data:/var/lib/postgresql/data

  redis:
    image: redis:8.10-alpine
    container_name: ms-user-redis
    ports:
      - "6379:6379"


volumes:
  user_db_data:
  email_db_data:
  book_db_data: